name: Android model verification tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test archive verification
        run: sh scripts/test_model_archive_verifier.sh
      - name: Compile public variant
        run: ./gradlew --no-daemon compilePubDebugKotlin compilePubDebugJavaWithJavac
